# Asset Scraping — docker compose
# crawler のみ .env を読む（認証情報はコンテナへ注入、ホストには出さない）
# mcp は Streamable HTTP（:26280）で常駐。stdio クライアントは README の mcpServers 設定例を参照
services:
  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    image: ghcr.io/solidlime/asset-scraping-crawler
    env_file: .env
    environment:
      - TZ=Asia/Tokyo
      - DB_PATH=/data/asset-scraping.db
      - AUTH_STATE_PATH=/data/auth-state.json
    volumes:
      - mfb-data:/data
    ports:
      - "8766:8766"
    restart: unless-stopped

  # WebUI ログイン（noVNC）。`docker compose up login-web` で一時起動する。
  # ホストブラウザで http://localhost:8767/vnc.html を開き、表示された Chromium で ssnb にログインする。
  login-web:
    image: ghcr.io/solidlime/asset-scraping-crawler
    env_file: .env
    environment:
      - TZ=Asia/Tokyo
      - AUTH_STATE_PATH=/data/auth-state.json
    volumes:
      - mfb-data:/data
    ports:
      - "8767:6080"
    command: ["/app/docker/login-web.sh"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/solidlime/asset-scraping-web
    environment:
      - TZ=Asia/Tokyo
      - DB_PATH=/data/asset-scraping.db
      - CRAWLER_URL=http://crawler:8766
    volumes:
      - mfb-data:/data
    ports:
      - "8765:8765"
    depends_on:
      - crawler
    restart: unless-stopped

  # MCP サーバー（Streamable HTTP）。`http://localhost:26280/mcp` で待ち受け。
  # DB は read-only（crawler が書き込む volume を ro マウント）。
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    image: ghcr.io/solidlime/asset-scraping-mcp
    environment:
      - MCP_TRANSPORT=http
      - PORT=26280
      - DB_PATH=/data/asset-scraping.db
    volumes:
      - mfb-data:/data:ro
    ports:
      - "26280:26280"
    restart: unless-stopped

volumes:
  mfb-data:
    external: true
