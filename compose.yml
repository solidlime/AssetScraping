# Asset Scraping — docker compose
# crawler のみ .env を読む（認証情報はコンテナへ注入、ホストには出さない）
# mcp は compose 外の独立イメージ（README の mcpServers 設定例を参照）
services:
  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    image: asset-scraping-crawler
    env_file: .env
    environment:
      - TZ=Asia/Tokyo
      - DB_PATH=/data/asset-scraping.db
      - AUTH_STATE_PATH=/data/auth-state.json
    volumes:
      - mfb-data:/data
    ports:
      - "8766:8766"
    restart: unless-stopped

  # WebUI ログイン（noVNC）。`docker compose up login-web` で一時起動する。
  # ホストブラウザで http://localhost:8767/vnc.html を開き、表示された Chromium で ssnb にログインする。
  login-web:
    image: asset-scraping-crawler
    env_file: .env
    environment:
      - TZ=Asia/Tokyo
      - AUTH_STATE_PATH=/data/auth-state.json
    volumes:
      - mfb-data:/data
    ports:
      - "8767:6080"
    command: ["/app/docker/login-web.sh"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: asset-scraping-web
    environment:
      - TZ=Asia/Tokyo
      - DB_PATH=/data/asset-scraping.db
      - CRAWLER_URL=http://crawler:8766
    volumes:
      - mfb-data:/data
    ports:
      - "8765:8765"
    depends_on:
      - crawler
    restart: unless-stopped

volumes:
  mfb-data:
    external: true
