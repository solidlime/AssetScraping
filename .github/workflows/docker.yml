# Docker image build & publish to GHCR (mf-dashboard 参考実装の流儀: docker/build-push-action + GITHUB_TOKEN)
# main push で crawler / web / mcp の 3 イメージを ghcr.io/solidlime へ publishing。
# マルチアーキは不要（NAS もローカルも amd64）。
name: docker

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [crawler, web, mcp]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/solidlime/asset-scraping-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
